<div class="flex h-screen bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden">
  <aside class="w-64 bg-slate-900/90 border-r border-slate-800/80 flex flex-col justify-between p-4 shadow-2xl backdrop-blur-md select-none">
    <div>
      <div class="flex items-center space-x-3 mb-8 px-3 py-2.5 bg-gradient-to-r from-slate-800/80 to-slate-800/30 rounded-2xl border border-slate-700/40">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-500 flex items-center justify-center font-black text-white shadow-lg shadow-indigo-500/30 text-lg">
          IK
        </div>
        <div>
          <h1 class="font-bold text-sm tracking-wide text-white">Inventaris Kampus</h1>
          <p class="text-[10px] font-medium text-emerald-400 flex items-center gap-1.5 mt-0.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> System Active
          </p>
        </div>
      </div>

      <nav class="space-y-1.5">
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-lg shadow-indigo-600/30 font-semibold"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all duration-200">
          <span class="text-base">📊</span>
          <span>Dashboard</span>
        </a>

        <a
          routerLink="/daftar-barang"
          routerLinkActive="bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-lg shadow-indigo-600/30 font-semibold"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all duration-200">
          <span class="text-base">📦</span>
          <span>Daftar Barang</span>
        </a>

        <a
          routerLink="/peminjaman"
          routerLinkActive="bg-gradient-to-r from-indigo-600 to-indigo-700 text-white shadow-lg shadow-indigo-600/30 font-semibold"
          class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all duration-200">
          <span class="text-base">📋</span>
          <span>History Peminjaman</span>
        </a>
        
        <div class="pt-2">
          <button
            (click)="toggleLabMenu()"
            class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs text-slate-400 hover:text-slate-100 hover:bg-slate-800/60 transition-all duration-200">
            <div class="flex items-center gap-3">
              <span class="text-base">🔬</span>
              <span>Kategori Lab</span>
            </div>
            <span class="text-[10px] text-slate-500 transition-transform duration-300" [class.rotate-180]="isLabMenuOpen">
              ▼
            </span>
          </button>

          @if (isLabMenuOpen) {
            <div class="pl-4 mt-1.5 space-y-1 border-l-2 border-indigo-500/30 ml-4">
              <a
                routerLink="/kategori-lab"
                fragment="lab-a"
                routerLinkActive="text-indigo-400 font-semibold bg-indigo-500/10 border-r-2 border-indigo-400"
                class="flex items-center gap-2 px-3 py-2 rounded-lg text-[11px] text-slate-400 hover:text-white transition-colors">
                <span>💻</span> Lab Komputer (A)
              </a>

              <a
                routerLink="/kategori-lab"
                fragment="lab-b"
                routerLinkActive="text-purple-400 font-semibold bg-purple-500/10 border-r-2 border-purple-400"
                class="flex items-center gap-2 px-3 py-2 rounded-lg text-[11px] text-slate-400 hover:text-white transition-colors">
                <span>⚡</span> Lab Elektronika (B)
              </a>
            </div>
          }
        </div>
      </nav>
    </div>

    <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between px-2">
      <div class="flex items-center gap-2.5"></div>
    </div>
  </aside>

    <main class="flex-1 overflow-y-auto p-8 bg-slate-950">
      <router-outlet></router-outlet>
    </main>
  </div>
