<div class="min-h-screen bg-slate-900 text-slate-100 font-sans">
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <div class="flex items-center space-x-3">
        </div>
        
        <nav class="flex space-x-1 sm:space-x-2">
          <button 
            (click)="activeTab.set('validate')"
            [class]="activeTab() === 'validate' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-700'"
            class="px-3 py-2 rounded-md text-xs sm:text-sm font-medium transition-colors">
            1. Validate Form
          </button>
          
          <button 
            (click)="activeTab.set('dynamic')"
            [class]="activeTab() === 'dynamic' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-700'"
            class="px-3 py-2 rounded-md text-xs sm:text-sm font-medium transition-colors">
            2. Dynamic Forms
          </button>
          
          <button 
            (click)="activeTab.set('crossfield')"
            [class]="activeTab() === 'crossfield' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-700'"
            class="px-3 py-2 rounded-md text-xs sm:text-sm font-medium transition-colors">
            3. Crossfield Form
          </button>
          
          <button 
            (click)="activeTab.set('miniproject')"
            [class]="activeTab() === 'miniproject' ? 'bg-indigo-600 text-white' : 'text-slate-300 hover:bg-slate-700'"
            class="px-3 py-2 rounded-md text-xs sm:text-sm font-medium transition-colors">
            4. Mini Project
          </button>
        </nav>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    @if (activeTab() === 'validate') {
      <app-validate-form />
    }
    @if (activeTab() === 'dynamic') {
      <app-building-dynamic-form />
    }
    @if (activeTab() === 'crossfield') {
      <app-crossfield-validator-form />
    }
    @if (activeTab() === 'miniproject') {
      <app-project-mini />
    }
  </main>
</div>
