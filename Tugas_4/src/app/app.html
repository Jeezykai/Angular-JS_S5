<div class="container">
  <h1>Family Expense Tracker</h1>

  <table class="expense-table">
    <thead>
      <tr>
        <th>Activity</th>
        <th>Category</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody>
      @for (item of expenses; track item.title) {
        <tr>
          <td>{{ item.title }}</td>
          <td>{{ item.category | category }}</td>
          <td [appAmountColor]="item.amount" class="amount-cell">
            {{ item.amount | rupiah }}
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3">Belum ada data pengeluaran.</td>
        </tr>
      }
    </tbody>
  </table>

  <div class="status-list">
    @for (item of expenses; track item.title) {
      <div class="status-item">
        <span 
          class="dot" 
          [style.background-color]="item.amount > 300000 ? '#e11d48' : '#10b981'">
        </span>
        <span class="status-text">{{ item.amount | rupiah }}</span>
      </div>
    }
  </div>
</div>
